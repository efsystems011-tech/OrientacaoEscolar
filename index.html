<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orientação Escolar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">
                <i data-lucide="graduation-cap"></i>
            </div>

            <div>
                <strong>Orientação</strong>
                <strong>Escolar</strong>
                <small>Gestão & Acompanhamento</small>
            </div>
        </div>

        <nav>
            <button class="menu active">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </button>

            <button class="menu">
                <i data-lucide="users"></i>
                Alunos
            </button>

            <button class="menu">
                <i data-lucide="clipboard-list"></i>
                Ocorrências
            </button>

            <button class="menu">
                <i data-lucide="file-text"></i>
                Documentos
            </button>

            <button class="menu">
                <i data-lucide="mic">
                    Reuniões & Áudios
                </i>
            </button>

            <button class="menu">
                <i data-lucide="bar-chart-3"></i>
                Relatórios
            </button>

            <button class="menu">
                <i data-lucide="calendar"></i>
                Calendário
            </button>

            <button class="menu">
                <i data-lucide="settings"></i>
                Configurações
            </button>

        </nav>

        <div class="sidebar-bottom">

            <div class="quote">
                <i data-lucide="sparkles"></i>

                <p>Organize, acompanhe e transforme histórias</p>
            </div>

            <div class="user-profile">
                <div class="avatar teacher-avatar">
                    EF
                </div>

                <div>
                    <strong>Enzo Furtuoso</strong>
                    <span>Orientador Escolar</span>
                </div>

                <i data-lucide="chevron-down"></i>
            </div>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="topbar">
            <div class="search">

                <i data-lucider="search"></i>

                <input type="text" id="searchAluno" placeholder="Buscar aluno...">
            </div>
        </header>
    </main>

    <script src="script.js"></script>
</body>

</html>
